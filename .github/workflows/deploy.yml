name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      # GitHub Pages serves this repo from https://<user>.github.io/citere-site/
      # until the custom domain is switched on. Set the repository variable
      # PATH_PREFIX to "/" once sitera.ai serves the site from its root.
      # CANONICAL_URL is the host that goes into canonical, hreflang and
      # JSON-LD. On the Pages preview that is the github.io URL, not the
      # production domain - and while data/site.json carries demo:true,
      # check.mjs refuses to build demo figures under the production host.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/citere-site/' }}
          CANONICAL_URL: ${{ vars.CANONICAL_URL || 'https://vit-koval.github.io/citere-site' }}
      - run: npm run check
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/citere-site/' }}
          CANONICAL_URL: ${{ vars.CANONICAL_URL || 'https://vit-koval.github.io/citere-site' }}
      # CLAUDE.md 10: Lighthouse >= 95 in all four categories on the homepage,
      # one claim page, the registry and one report. npm run lighthouse builds
      # its own copy into _site-lighthouse/ at the root prefix (where the
      # custom domain will serve it) and never touches _site/ - that build,
      # from the prefixed step above, is what gets deployed below. An earlier
      # version of this step ran `npm run build` again to reset the prefix,
      # which overwrote the prefixed _site/ with an unprefixed one right
      # before the upload, breaking the GitHub Pages subpath deploy.
      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

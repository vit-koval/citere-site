name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      # GitHub Pages serves this repo from https://<user>.github.io/citere-site/
      # until the custom domain is switched on. Set the repository variable
      # PATH_PREFIX to "/" once sitera.ai serves the site from its root.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/citere-site/' }}
      - run: npm run check
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/citere-site/' }}
      # CLAUDE.md 10: Lighthouse >= 95 in all four categories on the homepage,
      # one claim page, the registry and one report. Runs against the built
      # _site/ at the root prefix, which is where the custom domain serves it.
      - name: Lighthouse CI
        run: npm run build && npm run lighthouse
        env:
          PATH_PREFIX: /

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
